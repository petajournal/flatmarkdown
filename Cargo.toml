[workspace]
resolver = "3"
members = ["flatmarkdown", "flatmarkdown-ast", "flatmarkdown-ast2html"]

# All three crates always have the same version (ADR 012 and ADR 020 of peta-journal), so it
# is written only here.
[workspace.package]
version = "0.5.0"
edition = "2024"
# The oldest Rust that builds the workspace. The code uses let chains, and the dependencies
# `time` and `darling` ask for 1.88 too. The `msrv` job of the CI builds with this version.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/petajournal/flatmarkdown"

# Less debug info makes linking faster. A panic still shows the file name and the line number.
# flatmarkdown builds its AST with the types of flatmarkdown-ast (ADR 014 of peta-journal).
# flatmarkdown-ast2html renders that AST (ADR 020 of peta-journal).
# Keep this version the same as `version` above: a release always has all three crates.
[workspace.dependencies]
flatmarkdown-ast = { version = "=0.5.0", path = "flatmarkdown-ast" }

# Clippy warnings stay warnings, so that a new lint of a new toolchain does not stop the build.
# Only the lints below are errors: each one marks code that must not reach a release.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
