[package]
name = "flatmarkdown-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Flat Markdown AST (serde) for the JSON that the flatmarkdown crate produces"
readme = "README.md"
license-file = "../COPYING"
keywords = ["markdown", "ast", "serde", "flatmarkdown"]
categories = ["text-processing", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The round-trip tests read the AST that the flatmarkdown crate of this workspace makes.
# A path without a version: cargo leaves it out of the published manifest.
[dev-dependencies]
flatmarkdown = { path = "../flatmarkdown" }
