name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Clippy warnings do not fail this step. Only the lints set to "deny" or "forbid" in
      # [workspace.lints] of Cargo.toml do.
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # Builds each crate from its packaged files, as crates.io would. The tests above cannot
      # show a file that is missing from the package.
      # flatmarkdown-ast2html-wasm does not go to crates.io. The `npm` job below builds it.
      - run: cargo package --workspace --exclude flatmarkdown-ast2html-wasm --locked

  npm:
    name: build and test the npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flatmarkdown-ast2html-wasm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The package has no dependencies, so there is nothing to install.
      - run: npm run build
      - run: npm test

  msrv:
    name: build with the oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep this version the same as `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
