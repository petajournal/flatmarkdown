<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 1374" width="1224" height="1374" role="img" aria-labelledby="title desc">
  <title id="title">flatmarkdown workspace: crate dependencies, public functions, and the structure of a page</title>
  <desc id="desc">Four crates. flatmarkdown and flatmarkdown-ast2html depend on flatmarkdown-ast. flatmarkdown-ast2html-wasm depends on flatmarkdown-ast2html and flatmarkdown-ast. flatmarkdown-ast2html uses flatmarkdown only in its tests. flatmarkdown-ast uses facet only with its facet feature, for the types of other languages. A page is optional page metadata and a list of items. An item is optional item metadata and a body.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .heading { font-size: 20px; font-weight: 600; }
      .crate { font-size: 17px; font-weight: 600; }
      .sub { font-size: 12px; fill: #64748b; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #64748b; }
      .code { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 13px; fill: #334155; }
      .code .name { font-weight: 700; fill: #0f172a; }
      .ext { font-size: 12px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .sep { stroke: #cbd5e1; stroke-width: 1; }
      .dep { fill: none; stroke: #334155; stroke-width: 1.5; marker-end: url(#arrow); }
      .dev { fill: none; stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-dev); }
      .devtext { font-size: 11px; fill: #b45309; }
    </style>
  </defs>

  <rect width="1224" height="1374" fill="#ffffff"/>
  <text class="heading" x="40" y="38">flatmarkdown workspace 0.9.0: crate dependencies and public functions</text>

  <!-- Dependency arrows: from the crate that depends to the crate it uses -->
  <path class="dep" d="M300,434 L300,690"/>
  <path class="dep" d="M900,630 L900,690"/>
  <path class="dep" d="M900,280 L900,330"/>
  <path class="dep" d="M1160,140 L1190,140 L1190,820 L1160,820"/>
  <path class="dev" d="M640,380 L560,380"/>
  <text class="devtext" x="600" y="371" text-anchor="middle">dev</text>

  <!-- flatmarkdown -->
  <rect class="box" x="40" y="64" width="520" height="370" rx="8"/>
  <text class="crate" x="60" y="92">flatmarkdown</text>
  <text class="sub" x="60" y="112">Parser: Flat Markdown text to the AST</text>
  <line class="sep" x1="40" y1="124" x2="560" y2="124"/>
  <text class="label" x="60" y="146">PUBLIC FUNCTIONS</text>
  <text class="code" x="60" y="168"><tspan class="name">parse_body</tspan>(input: &amp;str) -&gt; Node</text>
  <text class="code" x="60" y="190"><tspan class="name">parse_body_with</tspan>(input: &amp;str, opts: &amp;BodyOptions) -&gt; Node</text>
  <text class="code" x="60" y="212"><tspan class="name">parse_page</tspan>(input: &amp;str) -&gt; Page</text>
  <text class="code" x="60" y="234"><tspan class="name">parse_page_with</tspan>(input: &amp;str, opts: &amp;BodyOptions) -&gt; Page</text>
  <text class="code" x="60" y="256"><tspan class="name">has_unclosed_block</tspan>(body: &amp;str) -&gt; bool</text>
  <text class="code" x="60" y="278"><tspan class="name">close_blocks</tspan>(body: &amp;str) -&gt; String</text>
  <text class="code" x="60" y="300"><tspan class="name">split_body</tspan>(body: &amp;str, at: usize) -&gt; (String, String)</text>
  <text class="label" x="60" y="326">PUBLIC METHODS</text>
  <text class="code" x="60" y="348"><tspan class="name">BodyOptions::relative_page_links</tspan>() -&gt; BodyOptions</text>
  <text class="label" x="60" y="374">PUBLIC TYPES</text>
  <text class="code" x="60" y="394">struct BodyOptions, enum LinkResolution</text>
  <text class="ext" x="60" y="418">External crates: comrak 0.51, serde_json 1</text>

  <!-- flatmarkdown-ast2html-wasm -->
  <rect class="box" x="640" y="64" width="520" height="216" rx="8"/>
  <text class="crate" x="660" y="92">flatmarkdown-ast2html-wasm</text>
  <text class="sub" x="660" y="112">wasm build for the npm package flatmarkdown-ast2html. Not on crates.io.</text>
  <line class="sep" x1="640" y1="124" x2="1160" y2="124"/>
  <text class="label" x="660" y="146">PUBLIC FUNCTIONS</text>
  <text class="code" x="660" y="168"><tspan class="name">render_to_html</tspan>(json: &amp;str, wikilink_href: Option&lt;String&gt;,</text>
  <text class="code" x="692" y="190">hashtag_href: Option&lt;String&gt;,</text>
  <text class="code" x="692" y="212">wikilink_fragment_pattern: Option&lt;String&gt;)</text>
  <text class="code" x="692" y="234">-&gt; Result&lt;String, JsError&gt;</text>
  <text class="sub" x="660" y="251">Its name in JavaScript is renderToHtml.</text>
  <text class="ext" x="660" y="269">External crates: wasm-bindgen 0.2</text>

  <!-- flatmarkdown-ast2html -->
  <rect class="box" x="640" y="330" width="520" height="300" rx="8"/>
  <text class="crate" x="660" y="358">flatmarkdown-ast2html</text>
  <text class="sub" x="660" y="378">Renderer: the AST to HTML, without a Markdown parser</text>
  <line class="sep" x1="640" y1="390" x2="1160" y2="390"/>
  <text class="label" x="660" y="412">PUBLIC FUNCTIONS</text>
  <text class="code" x="660" y="434"><tspan class="name">ast_to_html</tspan>(node: &amp;Node) -&gt; String</text>
  <text class="code" x="660" y="456"><tspan class="name">ast_to_html_with</tspan>(node: &amp;Node, o: &amp;HtmlOptions) -&gt; String</text>
  <text class="code" x="660" y="478"><tspan class="name">href_template_from_prefix</tspan>(prefix: &amp;str) -&gt; String</text>
  <text class="code" x="660" y="500"><tspan class="name">fill_href</tspan>(template: &amp;str, name: &amp;str) -&gt; String</text>
  <text class="code" x="660" y="522"><tspan class="name">split_wikilink</tspan>(url: &amp;str, fragment_pattern: &amp;str)</text>
  <text class="code" x="692" y="544">-&gt; (&amp;str, Option&lt;&amp;str&gt;)</text>
  <text class="label" x="660" y="570">PUBLIC TYPES</text>
  <text class="code" x="660" y="590">struct HtmlOptions</text>
  <text class="ext" x="660" y="614">External crates: regex-lite 0.1</text>

  <!-- flatmarkdown-ast -->
  <rect class="box" x="40" y="690" width="1120" height="260" rx="8"/>
  <text class="crate" x="60" y="718">flatmarkdown-ast</text>
  <text class="sub" x="60" y="738">The typed AST and its JSON form</text>
  <line class="sep" x1="40" y1="750" x2="1160" y2="750"/>
  <text class="label" x="60" y="772">PUBLIC FUNCTIONS</text>
  <text class="code" x="60" y="794"><tspan class="name">extract_text</tspan>(node: &amp;Node) -&gt; String</text>
  <text class="code" x="60" y="816"><tspan class="name">heading_level</tspan>(root: &amp;Node) -&gt; Option&lt;u8&gt;</text>
  <text class="label" x="60" y="844">PUBLIC TYPES</text>
  <text class="code" x="60" y="864">enum Node, struct Page, struct Item</text>
  <text class="code" x="60" y="884">enum ListType, enum ListDelimiter, enum Alignment</text>
  <text class="code" x="60" y="904">enum AlertType, enum PropValue</text>
  <text class="ext" x="60" y="932">External crates: serde 1, serde_json 1, facet 0.46 (optional: the facet feature)</text>
  <text class="label" x="620" y="772">PUBLIC METHODS</text>
  <text class="code" x="620" y="792"><tspan class="name">Node::from_json</tspan>(json: &amp;str) -&gt; Result&lt;Node, serde_json::Error&gt;</text>
  <text class="code" x="620" y="812"><tspan class="name">Node::to_json</tspan>(&amp;self) -&gt; String</text>
  <text class="code" x="620" y="832"><tspan class="name">Node::children</tspan>(&amp;self) -&gt; &amp;[Node]</text>
  <text class="code" x="620" y="852"><tspan class="name">Node::children_mut</tspan>(&amp;mut self) -&gt; Option&lt;&amp;mut Vec&lt;Node&gt;&gt;</text>
  <text class="code" x="620" y="872"><tspan class="name">Node::type_name</tspan>(&amp;self) -&gt; &amp;str</text>
  <text class="code" x="620" y="892"><tspan class="name">Node::walk</tspan>&lt;'a&gt;(&amp;'a self, visit: &amp;mut dyn FnMut(&amp;'a Node))</text>
  <text class="code" x="620" y="912"><tspan class="name">Page::from_json</tspan>(json: &amp;str) -&gt; Result&lt;Page, serde_json::Error&gt;</text>
  <text class="code" x="620" y="932"><tspan class="name">Page::to_json</tspan>(&amp;self) -&gt; String</text>

  <!-- Legend -->
  <path class="dep" d="M40,986 L96,986"/>
  <text class="sub" x="106" y="990">A depends on B</text>
  <path class="dev" d="M240,986 L296,986"/>
  <text class="sub" x="306" y="990">dev-dependency: only the tests use it</text>
  <text class="sub" x="1160" y="990" text-anchor="end">The arrow points to the crate that is used.</text>

  <!-- Page and item structure -->
  <line class="sep" x1="40" y1="1014" x2="1160" y2="1014"/>
  <text class="heading" x="40" y="1052">Structure of a page and an item</text>

  <!-- A page as text: one band per line, coloured by the part the line belongs to -->
  <rect class="box" x="40" y="1076" width="600" height="238" rx="8"/>
  <rect x="52" y="1089" width="440" height="20" fill="#e2e8f0"/>
  <rect x="52" y="1111" width="440" height="20" fill="#e2e8f0"/>
  <rect x="52" y="1133" width="440" height="20" fill="#e2e8f0"/>
  <rect x="52" y="1155" width="440" height="20" fill="#fef3c7"/>
  <rect x="52" y="1177" width="440" height="20" fill="#dcfce7"/>
  <rect x="52" y="1221" width="440" height="20" fill="#fef3c7"/>
  <rect x="52" y="1243" width="440" height="20" fill="#dcfce7"/>
  <text class="code" x="60" y="1104">---</text>
  <text class="code" x="60" y="1126">title: Trip</text>
  <text class="code" x="60" y="1148">---</text>
  <text class="code" x="60" y="1170">&lt;!-- @ 2026-09-26-18-15-30-6VZSYB4 --&gt;</text>
  <text class="code" x="60" y="1192"># Plan</text>
  <text class="code" x="60" y="1236">&lt;!-- @@ 2026-09-27-15-00-16-W3N8ASY plan="2026-09-28" --&gt;</text>
  <text class="code" x="60" y="1258">- [ ] Book the hotel</text>
  <text class="sub" x="504" y="1126">page-metadata</text>
  <text class="sub" x="504" y="1170">item 1: item-metadata</text>
  <text class="sub" x="504" y="1192">item 1: body</text>
  <text class="sub" x="504" y="1236">item 2: item-metadata</text>
  <text class="sub" x="504" y="1258">item 2: body</text>
  <text class="sub" x="60" y="1296">The number of @ is the level: @ is 1 and @@ is 2. An item without metadata has level 1.</text>

  <!-- The same page as the types of flatmarkdown-ast -->
  <rect class="box" x="690" y="1076" width="470" height="78" rx="8"/>
  <text class="code" x="710" y="1100"><tspan class="name">struct Page</tspan></text>
  <rect x="710" y="1112" width="10" height="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="code" x="728" y="1122">front_matter: Option&lt;String&gt;</text>
  <text class="sub" x="1144" y="1122" text-anchor="end">page-metadata, as text</text>
  <text class="code" x="728" y="1142">items: Vec&lt;Item&gt;</text>

  <rect class="box" x="690" y="1174" width="470" height="140" rx="8"/>
  <text class="code" x="710" y="1198"><tspan class="name">struct Item</tspan></text>
  <rect x="710" y="1210" width="10" height="10" fill="#fef3c7" stroke="#d97706"/>
  <text class="code" x="728" y="1220">level: u32</text>
  <text class="sub" x="1144" y="1220" text-anchor="end">the number of @</text>
  <rect x="710" y="1230" width="10" height="10" fill="#fef3c7" stroke="#d97706"/>
  <text class="code" x="728" y="1240">id: Option&lt;String&gt;</text>
  <text class="sub" x="1144" y="1240" text-anchor="end">the HMTID</text>
  <rect x="710" y="1250" width="10" height="10" fill="#fef3c7" stroke="#d97706"/>
  <text class="code" x="728" y="1260">properties: BTreeMap&lt;String, String&gt;</text>
  <text class="sub" x="1144" y="1260" text-anchor="end">key="value" pairs</text>
  <rect x="710" y="1270" width="10" height="10" fill="#dcfce7" stroke="#16a34a"/>
  <text class="code" x="728" y="1280">body: String</text>
  <text class="sub" x="1144" y="1280" text-anchor="end">the Markdown source</text>
  <text class="code" x="728" y="1300">ast: Node</text>
  <text class="sub" x="1144" y="1300" text-anchor="end">the result of parse_body(body)</text>

  <text class="sub" x="40" y="1346">parse_page takes the whole text and returns a Page. parse_body takes one body and returns its Node.</text>
</svg>
