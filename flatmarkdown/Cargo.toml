[package]
name = "flatmarkdown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flat Markdown parser — outline format with block-delimited items"
readme = "README.md"
keywords = ["markdown", "html", "ast", "comrak"]
categories = ["text-processing", "parsing"]

[dependencies]
comrak = { version = "0.51", features = ["shortcodes"] }
serde_json = "1"
